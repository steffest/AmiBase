<html>
<head>
    <style>
        body{
            text-align: center;
        }
        #out{
            padding: 20px;
            font-family: sans-serif;
            border: 2px solid #0161FE;
            width: 300px;
            margin: 30px auto;
            text-align: center;
        }

        button{
            background-color: #0161FE;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
<div id="out">Loading</div>
<button onclick="window.close()">Close</button>

<script>

    /*
        This file is used in the implicit grant oAuth flow as redirect page to collect the access token.
    */

    let hash = window.location.hash || window.location.search
    let out = document.getElementById("out");
    console.log("hash: "+ hash);
    if (hash){
        // find access_token
       let index = hash.indexOf("access_token=");
       let codeIndex = hash.indexOf("code=");
       if (index>=0) {
           let token = hash.substring(index + 13);
           token = token.split("&")[0];

           out.innerHTML += token;
           out.innerHTML += "<br>";
           try{
               out.innerHTML += window.opener ? window.opener.location : "no opener";
           }catch (error){
                out.innerHTML += "no opener";
           }


           localStorage.setItem("exchangeToken", token);

           window.close();


           //console.error("window.opener: "+window.opener);
       }else if (codeIndex>=0){
           let code = hash.substring(codeIndex + 5);
           code = code.split("&")[0];
           out.innerHTML += "code";
           localStorage.setItem("exchangeCode", code);
           console.error("code: "+code);
           window.close();
       }else{
           if (hash.indexOf("error=access_denied")>=0){
               out.innerHTML = "You declined access<br>to your dropbox account.";
               localStorage.setItem("exchange","error:declined");

               setTimeout(function(){
                   window.close();
               },2000);
           }else{
               noAction();
           }
       }
    }else{
        noAction();
    }

    function noAction(){
        out.innerHTML = "You seem to have arrived here by accident.<br>Close this window and try again.";
    }

</script>

</body>
</html>
